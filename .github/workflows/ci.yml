name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check:
          - name: format
            command: cargo fmt --check
            needs_raylib: false
          - name: test
            command: cargo test --all-targets
            needs_raylib: true
          - name: clippy
            command: cargo clippy --all-targets -- -D warnings
            needs_raylib: true
    name: ${{ matrix.check.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Raylib build dependencies
        if: matrix.check.needs_raylib
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libgl1-mesa-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev

      - run: ${{ matrix.check.command }}
