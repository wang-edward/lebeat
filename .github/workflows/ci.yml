name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check:
          - name: format
            command: cargo fmt --check
            needs_raylib: false
          - name: test
            command: cargo test --all-targets
            needs_raylib: true
          - name: clippy
            command: cargo clippy --all-targets -- -D warnings
            needs_raylib: true
    name: ${{ matrix.check.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Raylib build dependencies
        if: matrix.check.needs_raylib
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libgl1-mesa-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev

      - run: ${{ matrix.check.command }}

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Raylib and virtual-display dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libgl1-mesa-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev xvfb

      - run: xvfb-run -a cargo run --bin fuzz -- 1

  gigafuzz:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Raylib and virtual-display dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libgl1-mesa-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev xvfb

      - run: cargo build --bin fuzz && for seed in $(seq 1 20); do xvfb-run -a target/debug/fuzz "$seed"; done

  line_count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Report Rust line counts
        shell: bash
        run: |
          count() {
            git ls-files "$@" | xargs wc -l | awk 'END { print $1 }'
          }

          all_code=$(count 'src' ':!src/lib.rs' ':!src/bin/**')
          core=$(count 'src' ':!src/lib.rs' ':!src/bin/**' ':!src/plugin.rs' ':!src/plugin/**' ':!src/instrument.rs' ':!src/instrument/**')
          components=$(count 'src/plugin.rs' 'src/plugin' 'src/instrument.rs' 'src/instrument')
          test=$(count 'src/lib.rs' 'src/bin')

          {
            echo '## Line Counts'
            echo
            echo '| Category | Lines |'
            echo '| --- | ---: |'
            echo "| All code | $all_code |"
            echo "| Components | $components |"
            echo "| Core | $core |"
            echo "| Test | $test |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
